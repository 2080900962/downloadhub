<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能搜索全网最快下载源，支持GitHub、NPM、PyPI等镜像站加速">
    <title>DownloadHub - 智能下载源聚合平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">DownloadHub</span>
            </div>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/about">关于</a>
                <a href="https://github.com/yourusername/downloadhub" target="_blank">GitHub</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <h1>⚡ DownloadHub</h1>
            <p class="slogan">智能搜索全网最快下载源</p>
            <p class="subtitle">告别慢速下载，一键找到最快镜像站</p>
        </header>

        <div class="input-section">
            <input type="text" id="urlInput" placeholder="粘贴下载链接（支持 GitHub、NPM、PyPI、PyTorch 等）" autofocus>
            <div class="button-group">
                <button id="searchBtn" class="primary" onclick="startSearch('head')">
                    <span class="icon">🚀</span>
                    <span>快速测速</span>
                </button>
                <button id="rangeBtn" class="secondary" onclick="startSearch('range')">
                    <span class="icon">📊</span>
                    <span>精确测速</span>
                </button>
            </div>
            <div class="tips">
                <span>💡 支持：</span>
                <span class="tag">GitHub</span>
                <span class="tag">Node.js</span>
                <span class="tag">PyTorch</span>
                <span class="tag">PyPI</span>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div id="loadingText">正在搜索替代源...</div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📦</div>
            <h3>还没有搜索结果</h3>
            <p>粘贴一个下载链接，我们会帮你找到最快的镜像站</p>
            <div class="example-links">
                <p>试试这些示例：</p>
                <button class="example-btn" onclick="tryExample('https://nodejs.org/dist/v20.0.0/node-v20.0.0-win-x64.zip')">Node.js</button>
                <button class="example-btn" onclick="tryExample('https://github.com/git/git/archive/refs/tags/v2.40.0.zip')">GitHub</button>
            </div>
        </div>

        <div class="results" id="results"></div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>DownloadHub</h4>
                <p>开源免费的下载加速工具</p>
            </div>
            <div class="footer-section">
                <h4>链接</h4>
                <a href="https://github.com/yourusername/downloadhub">GitHub</a>
                <a href="/about">关于</a>
            </div>
            <div class="footer-section">
                <h4>技术栈</h4>
                <p>Python · Flask · Vanilla JS</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 DownloadHub · MIT License</p>
        </div>
    </footer>

    <div class="error-toast" id="errorToast"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
